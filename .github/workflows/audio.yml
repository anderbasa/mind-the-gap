# Genera los mp3 del Listening con Gemini TTS (gratis) y los guarda en el repo.
# Solo hace lo que falta o ha cambiado. Si se acaba la cuota del día, sigue al día siguiente (cron).
# Cuando hay audios nuevos, lanza «Publicar» para que lleguen a la app.
#
# Una sola vez: Settings → Secrets and variables → Actions → New repository secret:
#   GEMINI_API_KEY = tu clave de Gemini (la de AI Studio).

name: Audios del Listening

on:
  push:
    branches: [main]
    paths:
      - 'app/public/bank/listening/**'
      - '!app/public/bank/listening/audio/**'
      - 'app/public/bank/speaking/**'
      - 'app/src/listening/ttsCore.ts'
      - 'scripts/render-listening.mjs'
  schedule:
    # La cuota gratuita se reinicia a medianoche de California (8:00 UTC en invierno, 7:00 en verano).
    - cron: '35 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: audio
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generar los audios que falten
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/render-listening.mjs

      - name: Guardarlos y publicar la app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain app/public/bank/listening/audio)" ]; then
            echo "No hay audios nuevos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/public/bank/listening/audio
          git commit -m "Audios del Listening (automático)"
          git pull --rebase origin main
          git push origin HEAD:main
          sleep 15 # que GitHub vea el commit nuevo antes de publicar
          gh workflow run deploy.yml --ref main
