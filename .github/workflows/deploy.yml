# Comprueba (tests) y publica la app en GitHub Pages cada vez que se sube algo a main.
# También se puede lanzar a mano desde la pestaña «Actions».
#
# Una sola vez: Settings → Pages → Build and deployment → Source: «GitHub Actions».
# Y en Settings → Secrets and variables → Actions → Variables: WORKER_URL = dirección del Worker.

name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_WORKER_URL: ${{ vars.WORKER_URL }}
          VITE_APP_VERSION: ${{ github.run_number }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
